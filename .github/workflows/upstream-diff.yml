name: Upstream Diff (find newly untranslated strings)

on:
  schedule:
    - cron: "0 0 * * 1" # 每週一 00:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone upstream Bondage Club
        run: git clone --depth 1 https://gitlab.com/BondageProjects/Bondage-College.git .upstream/Bondage-College

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Run diff
        env:
          BC_UPSTREAM_DIR: ${{ github.workspace }}/.upstream/Bondage-College/BondageClub
        run: npm run diff

      - name: Open / update issue with report
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "翻譯缺口報告（自動）"
          content-filepath: reports/missing-cn.md
          labels: translation, automated
