<style>

oke:var(--accent);stroke-width:3}.node{position:absolute;transform:translateY(-50%);width:190px;min-height:48px;padding:9px 11px;border:1px solid #443952;border-left:4px solid var(--node-color,var(--accent));border-radius:7px;background:var(--node);color:var(--text);text-align:left;cursor:pointer;box-shadow:0 5px 18px #0005}.node:hover,.node:focus-visible{border-color:var(--node-color);background:#2a2335}.node.root{width:165px;background:#342252;border-color:var(--accent);font-weight:650}.node .type{display:block;color:var(--node-color);font-size:10px;letter-spacing:.07em;text-transform:uppercase}.node .label{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.detail{display:grid;grid-template-columns:minmax(220px,.7fr) 1.3fr;gap:18px;margin-top:15px;padding:15px 17px;border-left:3px solid var(--detail-color,var(--accent));background:var(--panel)}.detail h3{margin:0 0 4px;font-size:16px}.detail p{margin:0;color:var(--muted)}.files{display:flex;flex-wrap:wrap;gap:7px}.files a{padding:5px 8px;border:1px solid #443952;border-radius:5px;color:#d8c9f4;text-decoration:none;font-family:ui-monospace,Consolas,monospace;font-size:12px}.files a:hover{border-color:var(--detail-color);color:var(--text)}.mobile-select{display:none;width:100%;padding:10px;background:var(--panel);border:1px solid #443952;color:var(--text);border-radius:7px}@media(max-width:760px){.app{display:block}.sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid #352e42}.sidebar nav,.group-label{display:none}.mobile-select{display:block}.main{padding:18px 12px}.top{display:block}.legend{margin-top:10px}.detail{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><h1>BCTP 架構與健壯性</h1><p>2026-09-25 · 10 個功能分支 · 重構後架構</p></div><input id="search" class="search" type="search" placeholder="搜尋功能…" aria-label="搜尋功能"><select id="mobile-select" class="mobile-select" aria-label="選擇功能"></select><nav id="feature-list" aria-label="功能列表"></nav></aside><main class="main"><div class="top"><div><h2 id="title"></h2><p id="subtitle"></p></div><div class="legend"><span><i style="--c:var(--ui)"></i>UI</span><span><i style="--c:var(--controller)"></i>Controller</span><span><i style="--c:var(--core)"></i>Core</span><span><i style="--c:var(--hook)"></i>Hook</span><span><i style="--c:var(--storage)"></i>Storage</span><span><i style="--c:#ffd36b"></i>Audit</span></div></div><p style="color:var(--muted)">線條表示功能與檔案的關聯，非完整 import 或執行順序圖。<a style="color:#cdb4ff" href="architecture-review.md">閱讀完整檢視報告</a></p><section class="graph-wrap" aria-label="功能依賴束狀圖"><div id="graph" class="graph"><svg id="edges" class="edges" aria-hidden="true"></svg></div></section><section id="detail" class="detail" aria-live="polite"></section></main></div>
<script>
const features=[
  {
    "group": "核心",
    "id": "bootstrap",
    "name": "啟動、下載與重試",
    "desc": "輕量入口建立 BCTP 狀態；依目前語言載入 CN/TW JSON；另一語言延遲下載並快取，過時回應不重畫。失敗回收資源。",

        ]

    ]
  },
  {
    "group": "核心",
    "id": "generation",
    "name": "統一資料生成",
    "desc": "CN 來源經 OpenCC 產生 TW；gen/build 共用 schema。相容字典不再直接打包進 JavaScript。",
    "branches": [
      [
        "Storage",

        [

        ]

        [
          "scripts/gen-dict.js",
          "translations/tw-terms.json",

        ]

        [
          "scripts/build.js",
          "scripts/check-generated.js"
        ]
      ]
    ]
  },
  {
    "group": "核心",
    "id": "lookup",
    "name": "單一查表策略",
    "desc": "保留 surface、補充、新字典與相容 fallback 的優先序；結果與未命中各有 512 筆上限的快取，BCX／LSCG 啟用範圍不變。",
    "branches": [

    "branches": [
      [
        "Hook",
        "原生翻譯接口",

        ]

        ]
      ]
    ]
  },
  {
    "group": "遊戲接口",
    "id": "canvas",
    "name": "Canvas 與 BCX 日誌",
    "desc": "一般文字走 DrawText hooks；BCX 指令詳情捕捉原始段落再換行，畫面不變重用上一幀排版。讀取遊戲 lexical MainCanvas 並驗證 context。",

    "desc": "共用每節點／每屬性的 source/last 狀態；外部修改成為新原文。選取範圍與排程留在各 adapter。",
    "branches": [

    "desc": "獨立字庫處理 Shadow DOM／確認框、契約和設定；保留輸入值、option machine value 與事件。",
    "branches": [

    "branches": [

    "group": "維護與品質",

const colors={UI:'var(--ui)',Controller:'var(--controller)',Core:'var(--core)',Hook:'var(--hook)',Storage:'var(--storage)',Audit:'#ffd36b'},list=document.getElementById('feature-list'),select=document.getElementById('mobile-select'),search=document.getElementById('search'),graph=document.getElementById('graph'),edges=document.getElementById('edges'),detail=document.getElementById('detail');let active=features[0];
function shortPath(path){const p=path.split('/');return p.length>2?p.slice(-2).join('/'):path}
function renderList(query=''){list.innerHTML='';select.innerHTML='';let last='',optgroup;for(const feature of features.filter(f=>(f.name+' '+f.desc+' '+f.branches.flat(2).join(' ')).toLowerCase().includes(query.toLowerCase()))){if(feature.group!==last){const label=document.createElement('div');label.className='group-label';label.textContent=feature.group;list.append(label);optgroup=document.createElement('optgroup');optgroup.label=feature.group;select.append(optgroup);last=feature.group}const button=document.createElement('button');button.className='feature-btn';button.textContent=feature.name;button.setAttribute('aria-current',String(feature===active));button.onclick=()=>choose(feature);list.append(button);const option=document.createElement('option');option.value=feature.id;option.textContent=feature.name;option.selected=feature===active;optgroup.append(option)}}
function choose(feature){active=feature;renderList(search.value);renderGraph();select.value=feature.id}
function addNode(type,label,x,y,files,isRoot=false){const b=document.createElement('button');b.className='node'+(isRoot?' root':'');b.style.left=x+'px';b.style.top=y+'px';b.style.setProperty('--node-color',colors[type]||'var(--accent)');b.innerHTML='<span class="type">'+type+'</span><span class="label">'+label+'</span>';b.onclick=()=>showDetail(type,label,files);graph.append(b)}
function addPath(x1,y1,x2,y2,trunk=false){const mid=x1+(x2-x1)*.48,p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',`M${x1},${y1} C${mid},${y1} ${mid},${y2} ${x2},${y2}`);p.setAttribute('class','edge'+(trunk?' trunk':''));edges.append(p)}
function renderGraph(){document.getElementById('title').textContent=active.name;document.getElementById('subtitle').textContent=active.desc;graph.querySelectorAll('.node').forEach(n=>n.remove());edges.innerHTML='';const rows=active.branches.reduce((n,b)=>n+Math.max(1,b[2].length),0),height=Math.max(560,rows*66+70);graph.style.height=height+'px';edges.setAttribute('viewBox',`0 0 1100 ${height}`);const rootY=height/2;addNode('功能',active.name,35,rootY,[active.name],true);let cursor=45;for(const [type,label,files] of active.branches){const block=Math.max(1,files.length)*66,branchY=cursor+block/2;addNode(type,label,330,branchY,files);addPath(200,rootY,330,branchY,true);files.forEach((file,i)=>{const y=cursor+33+i*66;addNode(type,shortPath(file),660,y,[file]);addPath(520,branchY,660,y)});cursor+=block}showDetail('功能',active.name,active.branches.flatMap(b=>b[2]))}
function showDetail(type,label,files){detail.style.setProperty('--detail-color',colors[type]||'var(--accent)');detail.innerHTML='<div><h3>'+label+'</h3><p>'+type+' · '+files.length+' 個相關檔案</p></div><div class="files">'+files.map(file=>file.includes('/') || file.endsWith('.json') || file.endsWith('.md')?`<a href="../${file}">${file}</a>`:`<span>${file}</span>`).join('')+'</div>'}
search.addEventListener('input',()=>renderList(search.value));select.addEventListener('change',()=>{const feature=features.find(f=>f.id===select.value);if(feature)choose(feature)});renderList();renderGraph();
</script></body></html>
