const colors={UI:'var(--ui)',Controller:'var(--controller)',Core:'var(--core)',Hook:'var(--hook)',Storage:'var(--storage)',Audit:'#ffd36b'},list=document.getElementById('feature-list'),select=document.getElementById('mobile-select'),search=document.getElementById('search'),graph=document.getElementById('graph'),edges=document.getElementById('edges'),detail=document.getElementById('detail');let active=features.find(f=>f.id==='roadmap');
function shortPath(path){const p=path.split('/');return p.length>2?p.slice(-2).join('/'):path}
function renderList(query=''){list.innerHTML='';select.innerHTML='';let last='',optgroup;for(const feature of features.filter(f=>(f.name+' '+f.desc+' '+f.branches.flat(2).join(' ')).toLowerCase().includes(query.toLowerCase()))){if(feature.group!==last){const label=document.createElement('div');label.className='group-label';label.textContent=feature.group;list.append(label);optgroup=document.createElement('optgroup');optgroup.label=feature.group;select.append(optgroup);last=feature.group}const button=document.createElement('button');button.className='feature-btn';button.textContent=feature.name;button.setAttribute('aria-current',String(feature===active));button.onclick=()=>choose(feature);list.append(button);const option=document.createElement('option');option.value=feature.id;option.textContent=feature.name;option.selected=feature===active;optgroup.append(option)}}
function choose(feature){active=feature;renderList(search.value);renderGraph();select.value=feature.id}
function addNode(type,label,x,y,files,isRoot=false){const b=document.createElement('button');b.className='node'+(isRoot?' root':'');b.style.left=x+'px';b.style.top=y+'px';b.style.setProperty('--node-color',colors[type]||'var(--accent)');b.innerHTML='<span class="type">'+type+'</span><span class="label">'+label+'</span>';b.onclick=()=>showDetail(type,label,files);graph.append(b)}
function addPath(x1,y1,x2,y2,trunk=false){const mid=x1+(x2-x1)*.48,p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',`M${x1},${y1} C${mid},${y1} ${mid},${y2} ${x2},${y2}`);p.setAttribute('class','edge'+(trunk?' trunk':''));edges.append(p)}
function renderGraph(){document.getElementById('title').textContent=active.name;document.getElementById('subtitle').textContent=active.desc;graph.querySelectorAll('.node').forEach(n=>n.remove());edges.innerHTML='';const rows=active.branches.reduce((n,b)=>n+Math.max(1,b[2].length),0),height=Math.max(560,rows*66+70);graph.style.height=height+'px';edges.setAttribute('viewBox',`0 0 1100 ${height}`);const rootY=height/2;addNode('功能',active.name,35,rootY,[active.name],true);let cursor=45;for(const [type,label,files] of active.branches){const block=Math.max(1,files.length)*66,branchY=cursor+block/2;addNode(type,label,330,branchY,files);addPath(200,rootY,330,branchY,true);files.forEach((file,i)=>{const y=cursor+33+i*66;addNode(type,shortPath(file),660,y,[file]);addPath(520,branchY,660,y)});cursor+=block}showDetail('功能',active.name,active.branches.flatMap(b=>b[2]))}
function showDetail(type,label,files){detail.style.setProperty('--detail-color',colors[type]||'var(--accent)');detail.innerHTML='<div><h3>'+label+'</h3><p>'+type+' · '+files.length+' 個相關檔案</p></div><div class="files">'+files.map(file=>file.includes('/') || file.endsWith('.json') || file.endsWith('.md')?`<a href="../${file}">${file}</a>`:`<span>${file}</span>`).join('')+'</div>'}
search.addEventListener('input',()=>renderList(search.value));select.addEventListener('change',()=>{const feature=features.find(f=>f.id===select.value);if(feature)choose(feature)});renderList();renderGraph();
